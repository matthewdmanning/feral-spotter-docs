name: Markdown

on:
  pull_request:

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check changed Markdown and YAML
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- '*.md' '*.yml')
          if ((${#files[@]})); then
            npx --yes prettier@3.9.6 --check "${files[@]}"
          else
            echo "No Markdown or YAML files changed."
          fi
